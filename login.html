<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Machine Earnings</title>

    <link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header>

    <div class="logo">
        Machine Earnings
    </div>

</header>


<section class="hero">

    <h1>
        Welcome Back
    </h1>

    <p>
        Login to access your machine dashboard.
    </p>

</section>


<section class="machines">

    <div
        class="machine"
        style="max-width:450px;margin:auto;"
    >

        <h2 style="margin-bottom:20px;">
            Login
        </h2>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Email address"
                required
                style="
                    width:100%;
                    padding:14px;
                    margin-bottom:15px;
                    border:1px solid #ddd;
                    border-radius:8px;
                "
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
                style="
                    width:100%;
                    padding:14px;
                    margin-bottom:15px;
                    border:1px solid #ddd;
                    border-radius:8px;
                "
            >

            <button
                type="submit"
                class="cta"
                style="width:100%;"
            >
                Login
            </button>

        </form>

        <p style="margin-top:20px;text-align:center;">

            Don't have an account?

            <a
                href="signup.html"
                style="color:#16a34a;font-weight:bold;"
            >
                Create account
            </a>

        </p>

    </div>

</section>


<script src="supabase.js"></script>

<script>

document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;


            try {

                const {
                    data,
                    error
                } =
                await supabaseClient.auth.signInWithPassword({

                    email: email,

                    password: password

                });


                if (error) {

                    alert(error.message);

                    return;
                }


                const user = data.user;


                if (!user) {

                    alert("Login failed.");

                    return;
                }


                /*
                 * Create the user's profile after login.
                 * At this point auth.uid() is available,
                 * so the RLS INSERT policy can allow it.
                 */

                const {
                    data: existingProfile,
                    error: profileCheckError
                } =
                await supabaseClient
                    .from("profiles")
                    .select("id")
                    .eq("id", user.id)
                    .maybeSingle();


                if (profileCheckError) {

                    console.error(
                        profileCheckError
                    );

                    alert(
                        "Could not check your profile."
                    );

                    return;
                }


                if (!existingProfile) {

                    const metadata =
                        user.user_metadata || {};


                    const {
                        error: profileError
                    } =
                    await supabaseClient
                        .from("profiles")
                        .insert({

                            id: user.id,

                            full_name:
                                metadata.full_name ||
                                "User",

                            phone:
                                metadata.phone ||
                                null,

                            referral_code:
                                metadata.referral_code ||
                                null,

                            balance: 0

                        });


                    if (profileError) {

                        console.error(
                            profileError
                        );

                        alert(
                            "Profile setup failed: " +
                            profileError.message
                        );

                        return;
                    }

                }


                alert("Login successful!");

                window.location.href =
                    "dashboard.html";


            } catch (error) {

                console.error(error);

                alert(
                    "Something went wrong. Please try again."
                );

            }

        }
    );

</script>


</body>

</html>
