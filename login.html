<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Machine Earnings</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <div class="logo">
        Machine Earnings
    </div>

</header>


<section class="hero">

    <h1>
        Welcome Back
    </h1>

    <p>
        Login to access your machine dashboard.
    </p>

</section>


<section class="machines">

    <div
        class="machine"
        style="max-width:450px;margin:auto;"
    >

        <h2 style="margin-bottom:20px;">
            Login
        </h2>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Email address"
                required
                style="
                    width:100%;
                    padding:14px;
                    margin-bottom:15px;
                    border:1px solid #ddd;
                    border-radius:8px;
                "
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
                style="
                    width:100%;
                    padding:14px;
                    margin-bottom:15px;
                    border:1px solid #ddd;
                    border-radius:8px;
                "
            >

            <button
                type="submit"
                class="cta"
                style="width:100%;"
            >
                Login
            </button>

        </form>

        <p style="margin-top:20px;text-align:center;">

            Don't have an account?

            <a
                href="signup.html"
                style="color:#16a34a;font-weight:bold;"
            >
                Create account
            </a>

        </p>

    </div>

</section>


<script>

document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();

            alert(
                "Login system will be connected to Supabase next."
            );

        }
    );

</script>


</body>

</html>
