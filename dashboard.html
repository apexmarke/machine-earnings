<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dashboard - Machine Earnings</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>

<header>

    <div class="logo">
        Machine Earnings
    </div>

    <button
        class="login-btn"
        id="logoutBtn"
    >
        Logout
    </button>

</header>


<section class="hero">

    <h1>
        Welcome, <span id="userName">User</span> 👋
    </h1>

    <p>
        Manage your machines and track your earnings.
    </p>

</section>


<section class="machines">

    <div class="machine">

        <h3>
            Available Balance
        </h3>

        <div class="price">
            KSh <span id="balance">0.00</span>
        </div>

        <p>
            Your current available balance.
        </p>

    </div>


    <br>


    <h2>
        Your Machines
    </h2>


    <div
    class="machine-grid"
    id="machineList"
>
</div>

    </div>

</section>


<script src="supabase.js"></script>

<script>

async function loadDashboard() {

    try {

        const {
            data: {
                user
            },
            error
        } =
        await supabaseClient.auth.getUser();


        if (error || !user) {

            window.location.href =
                "login.html";

            return;
        }


        const {
            data: profile,
            error: profileError
        } =
        await supabaseClient
            .from("profiles")
            .select(
                "full_name, balance"
            )
            .eq("id", user.id)
            .single();


        if (profileError) {

            console.error(
                profileError
            );

            return;
        }


        document
    .getElementById("userName")
    .textContent =
    profile.full_name || user.email;


        document
            .getElementById("balance")
            .textContent =
            Number(
                profile.balance || 0
            ).toFixed(2);


    } catch (error) {

        console.error(error);

    }

}

async function loadMachines() {

    const machineList =
        document.getElementById("machineList");

    machineList.innerHTML =
        "<p>Loading machines...</p>";


    const {
        data: machines,
        error
    } =
    await supabaseClient
        .from("machines")
        .select("*")
        .order("price", {
            ascending: true
        });


    if (error) {

        console.error(error);

        machineList.innerHTML =
            "<p>Unable to load machines.</p>";

        return;
    }


    if (!machines || machines.length === 0) {

        machineList.innerHTML =
            "<p>No machines available yet.</p>";

        return;
    }


    machineList.innerHTML = "";


    machines.forEach(function(machine) {

        const card =
            document.createElement("div");

        card.className = "machine";


        card.innerHTML = `

            <h3>
                ${machine.name}
            </h3>

            <div class="price">
                KSh ${Number(machine.price).toLocaleString()}
            </div>

            <p>
                Daily earning:
                KSh ${Number(
                    machine.daily_earning
                ).toLocaleString()}
            </p>

            <p>
                Duration:
                ${machine.duration_days} days
            </p>

            <p>
                Total scheduled earnings:
                KSh ${Number(
                    machine.total_earning
                ).toLocaleString()}
            </p>

            <button
                class="login-btn"
                type="button"
            >
                Buy Machine
            </button>

        `;


        machineList.appendChild(card);

    });

}
document
    .getElementById("logoutBtn")
    .addEventListener(
        "click",
        async function() {

            await supabaseClient.auth.signOut();

            window.location.href =
                "login.html";

        }
    );


loadDashboard();
loadMachines();

</script>

</body>

</html>
